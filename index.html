<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqliy O'yin - Ingliz Tili Xotira va So'z O'yini</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 15px;
            border: 1px solid var(--border);
        }

        .score-board span {
            font-weight: 600;
            color: var(--primary);
        }

        /* GRID CARDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .card {
            background-color: #334155;
            height: 80px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card.flipped {
            background-color: var(--primary);
            color: white;
            transform: rotateY(180deg);
        }

        .card.matched {
            background-color: var(--success);
            color: white;
            cursor: default;
            opacity: 0.8;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* WIN MESSAGE */
        .win-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 10px;
            color: var(--success);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1><i class="fa-solid fa-brain"></i> Inglizcha Xotira O'yini</h1>
        <p class="subtitle">Inglizcha so'zni uning o'zbekcha tarjimasi bilan moslashtiring!</p>

        <div class="score-board">
            <div>Urinishlar: <span id="moves">0</span></div>
            <div>Topilganlar: <span id="matches">0</span> / 6</div>
        </div>

        <div class="grid" id="gameGrid"></div>

        <button class="btn" onclick="startGame()">O'yinni Qayta Boshlash</button>

        <div class="win-message" id="winMessage">
            🎉 Tabriklayman! Siz barcha so'zlarni to'g'ri topdingiz!
        </div>
    </div>
